<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">OpenEmbodied</title>
  <desc id="desc">OpenEmbodied wordmark with an adaptive light and dark color scheme.</desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16b8d4"/>
      <stop offset="0.5" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#ea5bb9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .wordmark {
      fill: #111827;
      stroke: rgba(255, 255, 255, 0.38);
      stroke-width: 1.5px;
      paint-order: stroke fill;
      font-family: "Segoe UI Variable Display", "Segoe UI", Inter, Arial, sans-serif;
      font-size: 126px;
      font-weight: 750;
      letter-spacing: -5px;
    }
    .accent { fill: url(#signal); }
    .trace { stroke: url(#signal); }
    .tagline {
      fill: #526079;
      font-family: "Segoe UI Variable Text", "Segoe UI", Inter, Arial, sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .wordmark {
        fill: #f4f7ff;
        stroke: rgba(8, 14, 30, 0.72);
        stroke-width: 3px;
      }
      .tagline { fill: #aab7cf; }
    }
  </style>

  <g transform="translate(600 126)" text-anchor="middle">
    <text class="wordmark" x="0" y="0">OpenEmbodied</text>
  </g>

  <g transform="translate(162 170)">
    <path class="trace" d="M0 0 H260 L282 -17 L306 17 L332 0 H706 L728 -17 L752 17 L778 0 H876"
          fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle class="accent" cx="0" cy="0" r="8"/>
    <circle class="accent" cx="876" cy="0" r="8"/>
  </g>

  <text class="tagline" x="600" y="232" text-anchor="middle">OPEN EMBODIED INTELLIGENCE</text>
</svg>
