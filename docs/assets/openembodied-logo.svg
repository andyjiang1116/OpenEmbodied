<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">OpenEmbodied</title>
  <desc id="desc">A technology-inspired OpenEmbodied wordmark with an adaptive light and dark color scheme.</desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08c7e8"/>
      <stop offset="0.48" stop-color="#5d70ff"/>
      <stop offset="1" stop-color="#e052c6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08c7e8" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#7480ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#e052c6" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1f2a44" flood-opacity="0.18"/>
    </filter>
    <clipPath id="wordClip">
      <text x="600" y="142" text-anchor="middle" font-family="Bahnschrift SemiCondensed, Rajdhani, Segoe UI, Arial, sans-serif" font-size="122" font-style="italic" font-weight="750" letter-spacing="-1">OpenEmbodied</text>
    </clipPath>
  </defs>

  <style>
    .wordmark {
      fill: #10192c;
      stroke: url(#signal);
      stroke-width: 2px;
      paint-order: stroke fill;
      font-family: "Bahnschrift SemiCondensed", Rajdhani, "Segoe UI", Arial, sans-serif;
      font-size: 122px;
      font-style: italic;
      font-weight: 750;
      letter-spacing: -1px;
    }
    .circuit { fill: none; stroke: url(#signal); stroke-width: 3; stroke-linecap: square; stroke-linejoin: bevel; }
    .node { fill: url(#signal); }
    .tagline {
      fill: #526079;
      font-family: "Bahnschrift", "Segoe UI", Inter, Arial, sans-serif;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: 7px;
    }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #f2f6ff; stroke-width: 2.4px; }
      .tagline { fill: #aab7cf; }
    }
  </style>

  <g filter="url(#shadow)">
    <text class="wordmark" x="600" y="142" text-anchor="middle">OpenEmbodied</text>
    <rect x="106" y="98" width="988" height="17" fill="url(#scan)" clip-path="url(#wordClip)"/>
  </g>

  <g class="circuit" filter="url(#glow)">
    <path d="M106 174H190L207 157H286"/>
    <path d="M914 157H993L1010 174H1094"/>
    <path d="M286 174H432L444 186L456 174H744L756 162L768 174H914"/>
  </g>
  <g class="node">
    <circle cx="106" cy="174" r="6"/><circle cx="207" cy="157" r="5"/>
    <circle cx="444" cy="186" r="5"/><circle cx="756" cy="162" r="5"/>
    <circle cx="993" cy="157" r="5"/><circle cx="1094" cy="174" r="6"/>
  </g>

  <path d="M464 217H512M688 217H736" stroke="url(#signal)" stroke-width="2" stroke-linecap="round"/>
  <text class="tagline" x="600" y="225" text-anchor="middle">RESEARCH ATLAS · EMBODIED AI</text>
</svg>
